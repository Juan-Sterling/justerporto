  <!-- Initial Theme Detection (Prevents FOUC) -->
  <script>
    (function () {
      try {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;

        let isDark = true;
        if (stored === 'dark') {
          isDark = true;
        } else if (stored === 'light') {
          isDark = false;
        } else if (prefersDark) {
          isDark = true;
        } else if (prefersLight) {
          isDark = false;
        } else {
          isDark = true; // Default fallback to dark for portfolio
        }

        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }

        const isSide = window.location.pathname.toLowerCase().startsWith('/sideprofile');
        document.documentElement.classList.add(isSide ? 'route-sideprofile' : 'route-main');

        // Prevent browser from auto-restoring scroll position on back/forward navigation
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }
      } catch (e) { }
    })();
  </script>
