<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181C"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>
    <!-- Iconic BABYMONSTER Devil Horn Motif -->
    <path id="horn" d="M12 2C9 7 4 14 3 22C7 19 11 15 12 2Z" transform="translate(2.5, 0.5) scale(0.46) rotate(-12 12 22)" fill="#E11D2E"/>
  </defs>

  <!-- Left & Right Stylized Devil Horns -->
  <use href="#horn"/>
  <use href="#horn" transform="translate(32, 0) scale(-1, 1)"/>

  <!-- Badge Container with Crimson Border -->
  <rect x="4" y="9" width="24" height="21" rx="6" fill="url(#badgeBg)" stroke="#E11D2E" stroke-width="1.6"/>
  <rect x="5.5" y="10.5" width="21" height="18" rx="4.5" fill="#E11D2E" fill-opacity="0.12"/>

  <!-- Code2 Motif (< / >) in Crimson Red -->
  <g fill="none" stroke="#E11D2E" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12.5 15.5L8.5 19.5L12.5 23.5" stroke-width="2.2"/>
    <path d="M19.5 15.5L23.5 19.5L19.5 23.5" stroke-width="2.2"/>
